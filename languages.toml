# ============ Python ============
[[language]]
name = "python"
language-servers = ["basedpyright", "ruff"]
auto-format = true
formatter = { command = "ruff", args = ["format", "--stdin-filename", "%{buffer_name}", "-"] }

[language-server.ruff]
command = "ruff"
args = ["server"]

# basedpyright over stock pyright: pyright does not advertise inlayHintProvider,
# so Python would get no inlay hints despite editor.lsp.display-inlay-hints.
# typeCheckingMode here is a global default -- a project's pyproject.toml wins.
[language-server.basedpyright.config.basedpyright.analysis]
typeCheckingMode = "standard"
inlayHints.callArgumentNames = false
inlayHints.variableTypes = true
inlayHints.functionReturnTypes = true
inlayHints.genericTypes = true

# ============ Rust ============
[language-server.rust-analyzer.config]
check.command = "clippy"
cargo.features = "all"

[language-server.rust-analyzer.config.inlayHints]
bindingModeHints.enable = true
chainingHints.enable = true
closingBraceHints.enable = true
closureReturnTypeHints.enable = "with_block"
parameterHints.enable = true
typeHints.enable = true


# ============ TypeScript / JavaScript ============
[language-server.typescript-language-server.config.typescript.inlayHints]
includeInlayParameterNameHints = "all"
includeInlayFunctionParameterTypeHints = true
includeInlayVariableTypeHints = true
includeInlayPropertyDeclarationTypeHints = true
includeInlayFunctionLikeReturnTypeHints = true
includeInlayEnumMemberValueHints = true

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]
config.userLanguages.typescriptreact = "javascriptreact"
config.userLanguages.typescript = "javascript"

[language-server.vscode-eslint-language-server.config]
experimental.useFlatConfig = true
format = false

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "tailwindcss-ls", "vscode-eslint-language-server"]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "javascript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server"]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "tailwindcss-ls", "vscode-eslint-language-server"]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-ls"]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

# Explicit language-servers drops superhtml from the default list (not installed).
[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "json"
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
